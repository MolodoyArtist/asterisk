name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Compile Python
        run: /usr/bin/python3 -m compileall -q src
      - name: Static analysis
        run: |
          python3 -m pip install --disable-pip-version-check ruff==0.16.10 bandit==1.9.4
          ruff check src tests
          bandit -q -r src
      - name: Check shell syntax
        run: bash -n install.sh scripts/*.sh scripts/mtproxy-run
      - name: Test REALITY target selection
        run: bash scripts/reality-target-smoke.sh
      - name: Install integration dependencies
        run: sudo apt-get update && sudo apt-get install -y nginx ripgrep shellcheck
      - name: Lint shell scripts
        run: shellcheck install.sh scripts/*.sh scripts/mtproxy-run
      - name: Scan repository
        run: bash scripts/check-repository.sh
      - name: Validate configurations and FakeTLS cover
        run: |
          log="${RUNNER_TEMP}/integration.log"
          if sudo bash scripts/integration-smoke.sh >"${log}" 2>&1; then
            cat "${log}"
          else
            cat "${log}"
            details="$(tail -n 30 "${log}")"
            details="${details//%/%25}"
            details="${details//$'\r'/%0D}"
            details="${details//$'\n'/%0A}"
            printf '::error title=Integration diagnostics::%s\n' "${details}"
            exit 1
          fi
      - name: Validate update and rollback
        run: sudo bash scripts/update-smoke.sh
