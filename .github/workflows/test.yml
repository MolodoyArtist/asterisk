name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile Python
        run: python3 -m compileall -q src
      - name: Static analysis
        run: |
          python3 -m pip install --disable-pip-version-check ruff==0.16.10 bandit==1.9.4
          ruff check src tests
          bandit -q -r src
      - name: Check shell syntax
        run: bash -n install.sh scripts/*.sh
      - name: Install integration dependencies
        run: sudo apt-get update && sudo apt-get install -y nginx ripgrep shellcheck
      - name: Lint shell scripts
        run: shellcheck install.sh scripts/*.sh
      - name: Scan repository
        run: bash scripts/check-repository.sh
      - name: Validate generated Nginx and Xray configurations
        run: sudo bash scripts/integration-smoke.sh
      - name: Validate update and rollback
        run: sudo bash scripts/update-smoke.sh
